name: Create, publish and deploy Docker image

on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: ["main"]

env:
  REGISTRY: ghcr.io

concurrency:
  group: production-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare image name
        id: image
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.image.outputs.sha }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
      DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Deploy on Dokploy
        run: |
          set -euo pipefail

          : "${DOKPLOY_URL:?Configure the DOKPLOY_URL variable}"
          : "${DOKPLOY_COMPOSE_ID:?Configure the DOKPLOY_COMPOSE_ID variable}"
          : "${DOKPLOY_API_KEY:?Configure the DOKPLOY_API_KEY secret}"

          dokploy_url="${DOKPLOY_URL%/}"
          short_sha="${DEPLOY_SHA::7}"
          payload="$(
            jq -n \
              --arg composeId "$DOKPLOY_COMPOSE_ID" \
              --arg title "Deploy ${short_sha}" \
              --arg description "GHCR image sha-${short_sha}" \
              '{composeId: $composeId, title: $title, description: $description}'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --url "${dokploy_url}/api/compose.deploy" \
            --header "accept: application/json" \
            --header "Content-Type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_KEY}" \
            --data "$payload"
