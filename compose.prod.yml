services:
  telegram-bot:
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-transcribe}
      SILVERBULLET_URL: ${SILVERBULLET_URL:-}
      SILVERBULLET_TOKEN: ${SILVERBULLET_TOKEN:-}
      SILVERBULLET_PUBLISH_PATH: ${SILVERBULLET_PUBLISH_PATH:-ballet/aulas}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
      TELEGRAM_MAX_AUDIO_BYTES: ${TELEGRAM_MAX_AUDIO_BYTES:-20971520}
      TELEGRAM_RETRY_INTERVAL_SECONDS: ${TELEGRAM_RETRY_INTERVAL_SECONDS:-300}
      OUTBOX_DIR: /agent/data/outbox
    volumes:
      - yas-data:/agent/data

volumes:
  yas-data:
