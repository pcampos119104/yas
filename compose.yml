services:
  agent:
    build:
      context: ./agent
      dockerfile: dev.Dockerfile
    command: uv run --frozen python -m agent.main
    env_file:
      - path: .env
        required: false
    volumes:
      - ./agent:/agent
      - ./:/workspace:ro
      - ./output:/agent/output
    stdin_open: true
    tty: true
