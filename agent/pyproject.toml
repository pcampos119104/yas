[project]
name = "agent"
version = "0.1.0"
description = "LangChain agent for the YAS ballet project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.0,<1.0.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
]

[project.scripts]
ballet-agent = "agent.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "ruff>=0.14.0,<0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
